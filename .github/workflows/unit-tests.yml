name: Unit Tests

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest src.test.solr_client_test
